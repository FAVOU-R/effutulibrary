services:
  # Web Service for FastAPI Application
  - type: web
    name: effutu-library-system
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: effutu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BREVO_SMTP_SERVER
        value: "smtp-relay.brevo.com"
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        value: "b428a1001@smtp-brevo.com"
      - key: BREVO_SMTP_PASSWORD
        sync: false # Set in Render dashboard or default mock fallback

  # Daily Cron Job for Overdue Fine & Email Detection (7 AM Daily)
  - type: cron
    name: effutu-overdue-cron
    env: python
    schedule: "0 7 * * *" # Every day at 7:00 AM UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python cron/overdue_check.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: effutu-db
          property: connectionString
      - key: BREVO_SMTP_SERVER
        value: "smtp-relay.brevo.com"
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        value: "b428a1001@smtp-brevo.com"

databases:
  - name: effutu-db
    databaseName: effutu_library
    user: effutu_admin
