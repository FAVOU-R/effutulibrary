{% extends "base.html" %}
{% block title %}Login - Effutu Municipal Library System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-lg p-6 shadow-md mt-6">
    <div class="text-center mb-6">
        <div class="inline-block p-3 bg-emerald-100 rounded-full text-emerald-700 mb-2">
            <i class="fa-solid fa-user-lock text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Account Login</h2>
        <p class="text-xs text-slate-500 mt-1">Access your Effutu Library Network Portal</p>
    </div>

    <div id="error-alert" class="hidden mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded text-xs font-semibold"></div>

    <form id="login-form" method="post" action="/auth/login" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Ghana Card / Voter ID / School ID / Email / Phone</label>
            <input type="text" name="email" required placeholder="Ghana Card / Voter ID / School ID / Email / Phone" class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
        </div>

        <button type="submit" class="w-full btn-effutu py-2.5 text-sm font-bold shadow">
            Sign In to Account
        </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        Don't have an account? 
        <a href="/register" class="text-emerald-700 font-bold hover:underline">Register here</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errDiv = document.getElementById('error-alert');
    errDiv.classList.add('hidden');

    const formData = new FormData(this);
    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Accept': 'application/json' },
            body: formData
        });

        if (res.redirected) {
            window.location.href = res.url;
            return;
        }

        let data = {};
        try {
            data = await res.json();
        } catch (jsonErr) {}

        if (res.ok) {
            window.location.href = data.redirect_url || '/dashboard/patron';
        } else {
            errDiv.textContent = data.error || data.detail || "Invalid email or password. Please check your credentials.";
            errDiv.classList.remove('hidden');
        }
    } catch (err) {
        // If fetch fails completely, fall back to traditional HTML form submit
        this.submit();
    }
});
</script>
{% endblock %}
