{% extends "base.html" %}

{% block title %}Page Not Found - Effutu Library System{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-lg w-full text-center space-y-6 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100">
        <div class="w-20 h-20 bg-rose-500/10 text-rose-600 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-inner border border-rose-500/20 animate-pulse">
            <i class="fa-solid fa-book-bookmark"></i>
        </div>

        <div class="space-y-2">
            <h1 class="text-6xl font-black text-slate-800 tracking-tight">404</h1>
            <h2 class="text-xl font-bold text-slate-700">Page Not Found</h2>
            <p class="text-sm text-slate-500 max-w-sm mx-auto">
                The resource or catalog page you are looking for doesn't exist or may have been moved.
            </p>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="w-full sm:w-auto px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house"></i>
                <span>Return to Dashboard</span>
            </a>
            <a href="/catalog" class="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i>
                <span>Browse Book Catalog</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
