{% extends "base.html" %}

{% block title %}System Error - Effutu Library System{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-lg w-full text-center space-y-6 bg-white p-8 sm:p-10 rounded-3xl shadow-xl border border-slate-100">
        <div class="w-20 h-20 bg-amber-500/10 text-amber-600 rounded-3xl mx-auto flex items-center justify-center text-4xl shadow-inner border border-amber-500/20">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div class="space-y-2">
            <h1 class="text-6xl font-black text-slate-800 tracking-tight">500</h1>
            <h2 class="text-xl font-bold text-slate-700">Internal Server Encountered an Issue</h2>
            <p class="text-sm text-slate-500 max-w-sm mx-auto">
                An unexpected system error occurred. The IT administration team has been notified.
            </p>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="w-full sm:w-auto px-6 py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-xs rounded-xl shadow-md transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-house"></i>
                <span>Return to Home</span>
            </a>
            <button onclick="window.location.reload()" class="w-full sm:w-auto px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs rounded-xl transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-right"></i>
                <span>Try Refreshing</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}
